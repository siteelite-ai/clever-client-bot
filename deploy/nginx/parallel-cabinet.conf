# Include only in the new chat-volt-next.testdevops.ru server block.
# ISPmanager already generates `location /`; do not add a duplicate.

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# The widget loader deliberately frames /?voltWidgetBootstrap=1 from the shop.
# Do not replace this with X-Frame-Options: DENY or frame-ancestors 'none'.
add_header Content-Security-Policy "frame-ancestors 'self' https://220volt.kz https://www.220volt.kz https://220volt.testdevops.ru" always;

location = /index.html {
    expires -1;
}

location = /widget-version.js {
    expires -1;
}

location = /widget-version.json {
    expires -1;
}

# React BrowserRouter has only these top-level application routes. Unknown
# paths and missing static assets must remain real 404s, not HTML responses.
location ~ ^/(?:login|widget|knowledge|analytics|users|integration|settings|logs)/?$ {
    try_files $uri /index.html;
}
