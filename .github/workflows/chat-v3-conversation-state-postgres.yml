name: V3 conversation state PostgreSQL 16

on:
  push:
    paths:
      - 'supabase/migrations/20261020210000_chat_v3_conversation_state.sql'
      - 'supabase/migrations/20261020210100_chat_v3_claim_binding.sql'
      - 'supabase/migrations/20261020210200_chat_v3_conversation_rpcs.sql'
      - 'supabase/migrations/20261020210300_chat_v3_atomic_finish.sql'
      - 'supabase/migrations/20261020210400_chat_v3_atomic_claim_begin.sql'
      - 'supabase/migrations/20260507081101_30c91ff9-9f7a-4048-b5bb-a3f62497ee17.sql'
      - 'supabase/migrations/20260903120000_chat_request_idempotency.sql'
      - 'supabase/migrations/20261009150000_chat_v3_admission_guard.sql'
      - 'supabase/migrations/20261020120000_public_api_admission.sql'
      - 'docs/security/chat-v3-conversation-state-local-test.sql'
      - 'scripts/qa/test-chat-v3-conversation-state-concurrency.sh'
      - 'scripts/qa/chat-v3-conversation-state-relevant-bootstrap.sql'
      - 'scripts/qa/chat-v3-conversation-state-relevant-compat.sql'
      - 'scripts/qa/test-chat-v3-conversation-state-relevant-migrations.sh'
      - 'scripts/qa/test-chat-v3-conversation-atomic-finish.sh'
      - 'scripts/qa/test-chat-v3-atomic-claim-begin.sh'
      - 'scripts/qa/chat-v3-conversation-state-rehearsal.md'
      - '.github/workflows/chat-v3-conversation-state-postgres.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20261020210000_chat_v3_conversation_state.sql'
      - 'supabase/migrations/20261020210100_chat_v3_claim_binding.sql'
      - 'supabase/migrations/20261020210200_chat_v3_conversation_rpcs.sql'
      - 'supabase/migrations/20261020210300_chat_v3_atomic_finish.sql'
      - 'supabase/migrations/20261020210400_chat_v3_atomic_claim_begin.sql'
      - 'supabase/migrations/20260507081101_30c91ff9-9f7a-4048-b5bb-a3f62497ee17.sql'
      - 'supabase/migrations/20260903120000_chat_request_idempotency.sql'
      - 'supabase/migrations/20261009150000_chat_v3_admission_guard.sql'
      - 'supabase/migrations/20261020120000_public_api_admission.sql'
      - 'docs/security/chat-v3-conversation-state-local-test.sql'
      - 'scripts/qa/test-chat-v3-conversation-state-concurrency.sh'
      - 'scripts/qa/chat-v3-conversation-state-relevant-bootstrap.sql'
      - 'scripts/qa/chat-v3-conversation-state-relevant-compat.sql'
      - 'scripts/qa/test-chat-v3-conversation-state-relevant-migrations.sh'
      - 'scripts/qa/test-chat-v3-conversation-atomic-finish.sh'
      - 'scripts/qa/test-chat-v3-atomic-claim-begin.sh'
      - 'scripts/qa/chat-v3-conversation-state-rehearsal.md'
      - '.github/workflows/chat-v3-conversation-state-postgres.yml'

jobs:
  conversation-state-sql:
    name: disposable PostgreSQL 16 conversation tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: conversation_ci
          POSTGRES_PASSWORD: conversation-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conversation_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      PGPASSWORD: conversation-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Replay bounded real chat-log and admission migrations
        run: bash scripts/qa/test-chat-v3-conversation-state-relevant-migrations.sh
      - name: Test atomic terminal log and conversation commit
        run: timeout 30s bash scripts/qa/test-chat-v3-conversation-atomic-finish.sh
      - name: Test atomic claim and begin with no orphan logs
        run: timeout 30s bash scripts/qa/test-chat-v3-atomic-claim-begin.sh
      - name: Declare rehearsal boundary
        run: |
          echo 'Replayed the actual chat-log, idempotency and admission migrations plus PR candidate on disposable PostgreSQL 16. Historical unrelated migrations, Supabase auth/default grants, the live schema and production locking are NOT covered; keep deployment blocked pending separate verification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Test privileges, binding, replay, fencing and topic isolation
        run: |
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d conversation_ci -v ON_ERROR_STOP=1 \
            -f docs/security/chat-v3-conversation-state-local-test.sql
      - name: Test two-connection CAS and duplicate begin
        run: timeout 25s bash scripts/qa/test-chat-v3-conversation-state-concurrency.sh
