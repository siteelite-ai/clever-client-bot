name: Integration secrets PostgreSQL 16

on:
  push:
    paths:
      - 'supabase/migrations/20261022060000_admin_integration_secrets.sql'
      - 'docs/security/admin-integration-secrets-local-test.sql'
      - 'docs/security/integration-secrets-cutover-*.sql'
      - 'scripts/qa/test-integration-secrets-cutover.sh'
      - '.github/workflows/integration-secrets-postgres.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20261022060000_admin_integration_secrets.sql'
      - 'docs/security/admin-integration-secrets-local-test.sql'
      - 'docs/security/integration-secrets-cutover-*.sql'
      - 'scripts/qa/test-integration-secrets-cutover.sh'
      - '.github/workflows/integration-secrets-postgres.yml'

jobs:
  service-only-store:
    name: disposable PostgreSQL 16 privilege and behavior test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: integration_secrets_ci
          POSTGRES_PASSWORD: integration-secrets-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d integration_secrets_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      PGPASSWORD: integration-secrets-ci-only
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Create disposable Supabase-like roles
        run: |
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d integration_secrets_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          GRANT USAGE ON SCHEMA public TO service_role;
          SQL

      - name: Apply additive migration
        run: |
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d integration_secrets_ci -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261022060000_admin_integration_secrets.sql

      - name: Verify client denial and server CRUD
        run: |
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d integration_secrets_ci -v ON_ERROR_STOP=1 \
            -f docs/security/admin-integration-secrets-local-test.sql

      - name: Verify manual cutover and fail-closed preflight in disposable databases
        run: bash scripts/qa/test-integration-secrets-cutover.sh
