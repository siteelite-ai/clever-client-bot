# Include only in the new api-volt-next.testdevops.ru server blocks.
# ISPmanager injects global locations (including webmail/admin utilities).
# A server-rewrite return runs before location selection, so those inherited
# locations cannot become available when the site-specific 503 gate is lifted.
# $uri is normalized and excludes the query string.
if ($uri !~ "^/(?:\.well-known/acme-challenge/|auth/v1/|rest/v1/|functions/v1/(?:chat-consultant-v3|admin-users|knowledge-process|admin-settings)$)") {
    return 404;
}
