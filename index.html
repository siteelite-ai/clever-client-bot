    <script>
      (function () {
        'use strict';
        var params = new URL(location.href).searchParams;
        if (params.get('voltWidgetBootstrap') !== '1' || parent === window) return;
        var version = 'widget-303d261aadb14569';
        var channel = '';
        var targetOrigin = '';
        try {
          channel = decodeURIComponent(location.hash.slice(1));
          targetOrigin = params.get('parentOrigin') || new URL(document.referrer).origin;
          if (new URL(targetOrigin).origin !== targetOrigin) return;
        } catch (e) {
          return;
        }
        if (!channel || !targetOrigin) return;
        parent.postMessage({
          type: 'volt-widget-version',
          channel: channel,
          version: version
        }, targetOrigin);
        window.stop();
      })();
    </script>
